<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – TrueEssence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'DM Sans-fallback', Arial, sans-serif;
            background: linear-gradient(145deg, #6A2C99 0%, #3A1555 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: rgba(106,44,153,0.05);
            border-radius: 50%;
        }

        .auth-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-container .logo .logo-icon {
            width: 64px;
            height: 64px;
            background: #6A2C99;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #FFFFFF;
            border: 3px solid #FA4616;
            margin: 0 auto 12px;
        }

        .auth-container .logo h1 {
            font-size: 24px;
            font-weight: 800;
            color: #1A1A2E;
        }

        .auth-container .logo h1 span {
            color: #FA4616;
        }

        .auth-container .logo p {
            font-size: 14px;
            color: #7A6F7E;
            margin-top: 4px;
        }

        .auth-container .form-group {
            margin-bottom: 18px;
        }

        .auth-container .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1A1A2E;
            margin-bottom: 6px;
        }

        .auth-container .form-group label .required {
            color: #FA4616;
        }

        .auth-container .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E9E1EC;
            border-radius: 10px;
            font-family: 'DM Sans', Arial, sans-serif;
            font-size: 14px;
            color: #1A1A2E;
            background: #FAF6F8;
            transition: all 0.3s;
            outline: none;
        }

        .auth-container .form-group input:focus {
            border-color: #6A2C99;
            box-shadow: 0 0 0 3px rgba(106,44,153,0.1);
        }

        .auth-container .form-group input::placeholder {
            color: #B89BBE;
        }

        .auth-container .form-group .password-wrapper {
            position: relative;
        }

        .auth-container .form-group .password-wrapper input {
            padding-right: 44px;
        }

        .auth-container .form-group .password-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7A6F7E;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }

        .auth-container .form-group .password-wrapper .toggle-password:hover {
            color: #6A2C99;
        }

        .auth-container .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .auth-container .form-options label {
            font-size: 13px;
            color: #7A6F7E;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .auth-container .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6A2C99;
            cursor: pointer;
        }

        .auth-container .form-options a {
            font-size: 13px;
            color: #6A2C99;
            font-weight: 500;
        }

        .auth-container .form-options a:hover {
            color: #FA4616;
        }

        .auth-container .btn-auth {
            width: 100%;
            padding: 14px;
            background: #6A2C99;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'DM Sans', Arial, sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-container .btn-auth:hover {
            background: #55217A;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(106,44,153,0.3);
        }

        .auth-container .btn-auth i {
            margin-right: 8px;
        }

        .auth-container .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .auth-container .divider::before,
        .auth-container .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E9E1EC;
        }

        .auth-container .divider span {
            font-size: 13px;
            color: #7A6F7E;
        }

        .auth-container .social-login {
            display: flex;
            gap: 12px;
        }

        .auth-container .social-login button {
            flex: 1;
            padding: 12px;
            border: 1px solid #E9E1EC;
            border-radius: 10px;
            background: #FFFFFF;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #1A1A2E;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-container .social-login button:hover {
            border-color: #6A2C99;
            background: #FAF6F8;
        }

        .auth-container .social-login button.google {
            color: #EA4335;
        }

        .auth-container .social-login button.facebook {
            color: #1877F2;
        }

        .auth-container .error-msg {
            background: rgba(194,43,61,0.08);
            border: 1px solid #C22B3D;
            color: #C22B3D;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .auth-container .error-msg.show {
            display: block;
        }

        .auth-container .success-msg {
            background: rgba(28,140,106,0.08);
            border: 1px solid #1C8C6A;
            color: #1C8C6A;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .auth-container .success-msg.show {
            display: block;
        }

        .auth-container .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7A6F7E;
        }

        .auth-container .footer-text a {
            color: #6A2C99;
            font-weight: 600;
        }

        .auth-container .footer-text a:hover {
            color: #FA4616;
        }

        /* ============================================================ */
        /* RESPONSIVE */
        /* ============================================================ */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 20px;
            }
            .auth-container .logo h1 {
                font-size: 20px;
            }
            .auth-container .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .auth-container .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- LOGIN CONTAINER -->
    <!-- ============================================================ -->
    <div class="auth-container">

        <!-- ===== LOGO ===== -->
        <div class="logo">
            <div class="logo-icon">TE</div>
            <h1>TRUE<span>ESSENCE</span></h1>
            <p>Welcome back! Sign in to continue.</p>
        </div>

        <!-- ===== MESSAGES ===== -->
        <div class="error-msg" id="errorMsg">
            <i class="fa-light fa-circle-exclamation"></i> Invalid email or password. Please try again.
        </div>
        <div class="success-msg" id="successMsg">
            <i class="fa-light fa-check-circle"></i> Login successful! Redirecting...
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="loginForm" onsubmit="return handleLogin(event)">

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fa-light fa-eye" id="toggleIcon"></i>
                    </span>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" /> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-auth">
                <i class="fa-light fa-right-to-bracket"></i> Sign In
            </button>

        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-login">
            <button class="google"><i class="fa-brands fa-google"></i> Google</button>
            <button class="facebook"><i class="fa-brands fa-facebook"></i> Facebook</button>
        </div>

        <div class="footer-text">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>

    </div>

    <script>
        // ============================================================ //
        // TOGGLE PASSWORD VISIBILITY
        // ============================================================ //
        function togglePassword() {
            var password = document.getElementById('password');
            var icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.className = 'fa-light fa-eye-slash';
            } else {
                password.type = 'password';
                icon.className = 'fa-light fa-eye';
            }
        }

        // ============================================================ //
        // LOGIN HANDLER
        // ============================================================ //
        function handleLogin(event) {
            event.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorMsg = document.getElementById('errorMsg');
            var successMsg = document.getElementById('successMsg');

            // Hide all messages first
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            // Demo credentials
            var validEmail = 'admin@trueessence.com';
            var validPassword = 'password';

            if (email === validEmail && password === validPassword) {
                // Success
                successMsg.classList.add('show');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);
                return false;
            } else {
                // Show error
                errorMsg.classList.add('show');
                setTimeout(function() {
                    errorMsg.classList.remove('show');
                }, 4000);
                return false;
            }
        }

        // ============================================================ //
        // ENTER KEY SUPPORT
        // ============================================================ //
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var form = document.getElementById('loginForm');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>

</body>
</html>
